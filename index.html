<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Happy Janmashtami</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
      }

      /* Blurred, scaled-up copy fills the whole screen so there are
       never black bars, on desktop OR mobile, whatever the aspect
       ratio mismatch is. */
      #bgVideo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(35px) brightness(0.55) saturate(1.1);
        transform: scale(1.15); /* hides soft blurred edges */
        pointer-events: none;
        user-select: none;
      }

      /* The real video sits on top, fully visible, never cropped. */
      #screen {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 2;
        pointer-events: none;
        user-select: none;
      }

      /* Logo badge — desktop default: bottom right corner */
      #brand {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        right: 170px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        z-index: 10;
        pointer-events: none;
      }
      #brand img {
        height: clamp(40px, 8vw, 48px);
        width: auto;
        filter: drop-shadow(0 0 6px rgba(80, 220, 255, 0.55));
      }

      /* Mobile greeting text — hidden on desktop */
      #mobileMsg {
        display: none;
      }

      /* Mobile: logo moves to top center, greeting text appears below it */
      @media (max-width: 768px) {
        #brand {
          top: env(safe-area-inset-top, 0px);
          bottom: auto;
          left: 0;
          right: 0;
          justify-content: center;
          padding: clamp(10px, 3vw, 18px) 0 6px;
        }
        #brand img {
          height: clamp(36px, 9vw, 48px);
        }

        #mobileMsg {
          display: block;
          position: fixed;
          top: calc(env(safe-area-inset-top, 0px) + clamp(46px, 13vw, 74px));
          left: 0;
          right: 0;
          text-align: center;
          z-index: 10;
          pointer-events: none;
          font-family:
            -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", sans-serif;
          font-weight: 700;
          font-size: clamp(18px, 5.5vw, 26px);
          color: #ffffff;
          letter-spacing: 0.5px;
          text-shadow:
            0 0 10px rgba(80, 220, 255, 0.7),
            0 0 3px rgba(0, 0, 0, 0.6);
        }
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="avi.codes.png" alt="avi.codes logo" />
    </div>

    <div id="mobileMsg">Happy Janmashtami</div>

    <div id="stage">
      <video
        id="bgVideo"
        src="video.mp4"
        loop
        muted
        playsinline
        autoplay
      ></video>
      <video
        id="screen"
        src="video.mp4"
        loop
        muted
        playsinline
        autoplay
        controlsList="nodownload noplaybackrate"
        disablePictureInPicture
      ></video>
    </div>

    <script>
      const bg = document.getElementById("bgVideo");
      const fg = document.getElementById("screen");

      bg.play().catch(() => {});
      fg.play().catch(() => {});

      // Keep the blurred background loosely in sync with the main video.
      fg.addEventListener("timeupdate", () => {
        if (Math.abs(bg.currentTime - fg.currentTime) > 0.3) {
          bg.currentTime = fg.currentTime;
        }
      });

      // If the user interacts with the page, unmute the main video (bg stays muted).
      function unmuteOnInteraction() {
        fg.muted = false;
        fg.play().catch(() => {});
      }
      window.addEventListener("click", unmuteOnInteraction, { once: true });
      window.addEventListener("keydown", unmuteOnInteraction, { once: true });
      window.addEventListener("touchstart", unmuteOnInteraction, {
        once: true,
        passive: true,
      });
    </script>
  </body>
</html>
